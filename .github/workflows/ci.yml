name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: bin/test unit
      - name: Integration tests
        run: bin/test integration
      - name: Stop the test stack
        if: always()
        run: bin/test down
